<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro — IA para Management | Legado de Familia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12141c;
    --card: #1a1d29;
    --card-line: #2a2e3d;
    --blue: #5b6ef2;
    --blue-soft: #8a97f5;
    --ink: #f4f5f9;
    --muted: #9098ac;
    --success: #6fcf97;
  }
  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 32px 16px;
  }
  .wrap{
    width:100%;
    max-width: 880px;
  }
  .card{
    background: var(--card);
    border: 1px solid var(--card-line);
    border-radius: 20px;
    overflow:hidden;
    display:grid;
    grid-template-columns: 220px 1fr;
  }
  @media (max-width: 680px){
    .card{ grid-template-columns: 1fr; }
    .side{ min-height: 140px !important; }
  }
  .side{
    position:relative;
    background: #5676ff;
    min-height: 520px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 36px;
  }
  .side img{
    width:100%;
    height:auto;
    max-width: 220px;
  }
  .logo-top{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom: 22px;
  }
  .logo-top img{ height: 30px; width:auto; display:block; }
  .content{
    padding: 40px 40px 36px;
  }
  .eyebrow{
    display:inline-block;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--blue-soft);
    font-weight: 600;
    margin-bottom: 14px;
  }
  h1{
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-size: 32px;
    line-height: 1.15;
    margin: 0 0 6px;
    color: var(--ink);
  }
  .subtitle{
    color: var(--muted);
    font-size: 14.5px;
    margin: 0 0 22px;
  }
  .meta{
    display:flex;
    flex-wrap: wrap;
    gap: 10px 22px;
    padding: 14px 0 24px;
    border-bottom: 1px solid var(--card-line);
    margin-bottom: 26px;
    font-size: 13.5px;
    color: var(--muted);
  }
  .meta strong{ color: var(--ink); font-weight: 500; }
  .grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .field{ display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
  .field.full{ grid-column: 1 / -1; }
  label{ font-size: 12.5px; color: var(--muted); font-weight:500; }
  input{
    background: #12141c;
    border: 1px solid var(--card-line);
    border-radius: 10px;
    padding: 11px 13px;
    color: var(--ink);
    font-family:'Inter', sans-serif;
    font-size: 14.5px;
    outline: none;
    transition: border-color .15s ease;
  }
  input:focus{ border-color: var(--blue-soft); }
  input::placeholder{ color: #565d70; }
  button{
    width:100%;
    margin-top: 6px;
    background: var(--blue);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 13px 18px;
    font-size: 14.5px;
    font-weight: 600;
    font-family:'Inter', sans-serif;
    cursor:pointer;
    transition: background .15s ease, transform .1s ease;
  }
  button:hover{ background: #4a5ce0; }
  button:active{ transform: scale(0.99); }
  button:disabled{ background:#3a3f52; cursor:not-allowed; }
  .error{ color:#f28b82; font-size: 12.5px; margin-top: 10px; min-height: 16px; }
  .done{
    text-align:center;
    padding: 30px 10px 10px;
  }
  .done .check{
    width:52px; height:52px; border-radius:50%;
    background: rgba(111,207,151,0.12);
    display:flex; align-items:center; justify-content:center;
    margin: 0 auto 16px;
  }
  .done h2{
    font-family:'Playfair Display', serif;
    font-size: 22px; margin: 0 0 8px; color: var(--ink);
  }
  .done p{ color: var(--muted); font-size: 14px; margin:0; }
</style>
</head>

        <h1>IA para Management</h1>
        <p class="subtitle">Con el Prof. Pablo Sartor — organiza Legado de Familia, en el IEEM.</p>

        <div class="meta">
          <span>📅 <strong>Martes 11 de agosto</strong></span>
          <span>🕐 <strong>09:00 a 11:00 hs</strong></span>
          <span>📍 <strong>IEEM Escuela de Negocios</strong></span>
        </div>

        <form id="regForm">
          <div class="grid">
            <div class="field">
              <label for="nombre">Nombre</label>
              <input id="nombre" placeholder="Tu nombre" required>
            </div>
            <div class="field">
              <label for="apellido">Apellido</label>
              <input id="apellido" placeholder="Tu apellido" required>
            </div>
          </div>
          <div class="field full">
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="tu@email.com" required>
          </div>
          <div class="grid">
            <div class="field">
              <label for="telefono">Teléfono</label>
              <input id="telefono" placeholder="09X XXX XXX">
            </div>
            <div class="field">
              <label for="empresa">Empresa / Organización</label>
              <input id="empresa" placeholder="Opcional">
            </div>
          </div>
          <button type="submit" id="submitBtn">Confirmar asistencia</button>
          <div class="error" id="errorMsg"></div>
        </form>

        <div class="done" id="doneMsg" style="display:none;">
          <div class="check">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6fcf97" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </div>
          <h2>Asistencia confirmada</h2>
          <p>Te esperamos el martes 11 de agosto en el IEEM.</p>
        </div>
      </div>
    </div>
  </div>

<script>
// Pegá acá la URL de tu Apps Script (paso 3 de la guía), termina en /exec
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbypiuB_IBD6yX1fqldGhhn55OqBpw3F7wHD_QS0y0-7BPt0W8Dh5qMbRGRDZzKGqa2c/exec';

const form = document.getElementById('regForm');
const errorMsg = document.getElementById('errorMsg');
const submitBtn = document.getElementById('submitBtn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorMsg.textContent = '';

  const nombre = document.getElementById('nombre').value.trim();
  const apellido = document.getElementById('apellido').value.trim();
  const email = document.getElementById('email').value.trim();
  const telefono = document.getElementById('telefono').value.trim();
  const empresa = document.getElementById('empresa').value.trim();

  if (!nombre || !apellido || !email) {
    errorMsg.textContent = 'Completá nombre, apellido y email.';
    return;
  }

  if (SHEET_URL.indexOf('PEGAR_ACA') !== -1) {
    errorMsg.textContent = 'Falta configurar la URL del Google Sheet en el código (SHEET_URL).';
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = 'Enviando...';

  const registro = { nombre, apellido, email, telefono, empresa, fecha: new Date().toISOString() };

  try {
    // no-cors: Apps Script no responde con headers CORS, así que enviamos
    // "a ciegas" y confiamos en que si fetch no tira error, se guardó.
    await fetch(SHEET_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(registro)
    });
    form.style.display = 'none';
    document.getElementById('doneMsg').style.display = 'block';
  } catch (err) {
    errorMsg.textContent = 'No se pudo guardar el registro. Probá de nuevo.';
    submitBtn.disabled = false;
    submitBtn.textContent = 'Confirmar asistencia';
  }
});
</script>
